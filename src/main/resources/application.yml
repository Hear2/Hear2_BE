spring:
  application:
    name: hear2

  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

app:
  mail:
    provider: resend
    resend:
      api-key: ${RESEND_API_KEY:}
      from: ${RESEND_FROM_EMAIL:onboarding@resend.dev}
      connect-timeout-ms: ${RESEND_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${RESEND_READ_TIMEOUT_MS:5000}
  file-storage:
    type: ${CHAT_STORAGE_TYPE:local}
    upload-dir: ${CHAT_UPLOAD_DIR:uploads}
  memory-storage:
    type: ${MEMORY_STORAGE_TYPE:local}
    upload-dir: ${MEMORY_UPLOAD_DIR:memory-uploads}
  media-storage:
    type: ${MEDIA_STORAGE_TYPE:${MEMORY_STORAGE_TYPE:local}}
    presigned-upload-expiration-minutes: ${MEDIA_PRESIGNED_UPLOAD_EXPIRATION_MINUTES:10}
    presigned-read-expiration-minutes: ${MEDIA_PRESIGNED_READ_EXPIRATION_MINUTES:10}
  location-sharing:
    name-refresh-distance-meters: ${LOCATION_NAME_REFRESH_DISTANCE_METERS:50}
  time-capsule:
    open-scheduler-delay-ms: ${TIME_CAPSULE_OPEN_SCHEDULER_DELAY_MS:60000}
  emotion:
    analysis:
      enabled: ${EMOTION_ANALYSIS_ENABLED:true}
      base-url: ${EMOTION_ANALYSIS_BASE_URL:http://127.0.0.1:8000}
      analyze-path: ${EMOTION_ANALYSIS_PATH:/analyze}
      judge-path: ${JUDGE_ANALYSIS_PATH:/judge}
      connect-timeout-ms: ${EMOTION_ANALYSIS_CONNECT_TIMEOUT_MS:1500}
      read-timeout-ms: ${EMOTION_ANALYSIS_READ_TIMEOUT_MS:5000}
  fcm:
    enabled: ${FCM_ENABLED:false}
    credentials-path: ${FCM_CREDENTIALS_PATH:}
    project-id: ${FCM_PROJECT_ID:}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:}
    refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:}

cloudflare:
  r2:
    access-key: ${R2_ACCESS_KEY:}
    secret-key: ${R2_SECRET_KEY:}
    endpoint: ${R2_ENDPOINT:}
    bucket: ${R2_BUCKET:hear2-storage}
    public-url: ${R2_PUBLIC_URL:}
    region: ${R2_REGION:auto}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  report:
    enabled: ${OPENAI_REPORT_ENABLED:true}
    model: ${OPENAI_REPORT_MODEL:${OPENAI_MODEL:gpt-4o-mini}}
    connect-timeout-ms: ${OPENAI_REPORT_CONNECT_TIMEOUT_MS:1500}
    read-timeout-ms: ${OPENAI_REPORT_READ_TIMEOUT_MS:5000}

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}
  local:
    radius-meters: ${KAKAO_LOCAL_RADIUS_METERS:1000}

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}

server:
  port: ${PORT:8080}
