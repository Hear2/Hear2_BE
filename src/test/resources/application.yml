spring:
  datasource:
    url: jdbc:h2:mem:hear2-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  file-storage:
    type: local
    upload-dir: ${java.io.tmpdir}/hear2-test-uploads
  memory-storage:
    type: local
    upload-dir: ${java.io.tmpdir}/hear2-test-memory-uploads
  location-sharing:
    name-refresh-distance-meters: 50
  emotion:
    analysis:
      enabled: false
      base-url: http://127.0.0.1:8000
      analyze-path: /analyze
      judge-path: /judge
      connect-timeout-ms: 1500
      read-timeout-ms: 5000
  fcm:
    enabled: false
    credentials-path:
    project-id:
  jwt:
    secret: test-secret
    access-token-expiration-seconds: 3600

openai:
  api-key:
  model: gpt-4o-mini

kakao:
  rest-api-key:
  local:
    radius-meters: 1000
