spring:
  datasource:
    url: jdbc:h2:mem:hear2-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  file-storage:
    type: local
    upload-dir: ${java.io.tmpdir}/hear2-test-uploads
